name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ["self-hosted", "Linux", "X64"]
    defaults:
      run:
        working-directory: py

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check robinhood/agentic tests/test_agentic.py

      - name: Ruff format check
        run: python -m ruff format --check robinhood/agentic tests/test_agentic.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p test_agentic.py

      - name: MkDocs strict build
        run: python -m mkdocs build --strict
